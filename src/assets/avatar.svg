<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5D77D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFAB5A;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="borderGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#6EE7B7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333EA;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Outer gradient border circle -->
  <circle cx="100" cy="100" r="100" fill="url(#borderGradient)"/>
  
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)"/>
  
  <!-- Dark navy fill for character -->
  <ellipse cx="100" cy="85" rx="45" ry="50" fill="#001f3f"/>
  
  <!-- Face light color -->
  <circle cx="100" cy="75" r="35" fill="#f5e6d3"/>
  
  <!-- Hair -->
  <path d="M 65 50 Q 60 30 100 25 Q 140 30 135 50 L 135 80 Q 135 85 130 85 L 70 85 Q 65 85 65 80 Z" fill="#1a1a2e"/>
  
  <!-- Hair highlights/shadows -->
  <path d="M 75 35 Q 75 25 85 20" stroke="#2a2a3e" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 110 32 Q 115 25 125 28" stroke="#2a2a3e" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Left eye -->
  <circle cx="82" cy="70" r="7" fill="#f4d03f"/>
  <circle cx="82" cy="70" r="4" fill="#1a1a2e"/>
  <circle cx="83" cy="68" r="2" fill="#fff"/>
  
  <!-- Right eye -->
  <circle cx="118" cy="70" r="7" fill="#f4d03f"/>
  <circle cx="118" cy="70" r="4" fill="#1a1a2e"/>
  <circle cx="119" cy="68" r="2" fill="#fff"/>
  
  <!-- Eye shine marks -->
  <line x1="75" y1="65" x2="72" y2="60" stroke="#f4d03f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="75" y1="68" x2="70" y2="70" stroke="#f4d03f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="125" y1="65" x2="128" y2="60" stroke="#f4d03f" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="125" y1="68" x2="130" y2="70" stroke="#f4d03f" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Nose -->
  <line x1="100" y1="75" x2="100" y2="82" stroke="#e6d4c1" stroke-width="2"/>
  
  <!-- Mouth -->
  <path d="M 90 88 Q 100 92 110 88" stroke="#d4938a" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Shoulder/outfit -->
  <ellipse cx="100" cy="120" rx="50" ry="35" fill="#1a1a2e"/>
  
  <!-- Neck -->
  <rect x="90" y="95" width="20" height="18" fill="#f5e6d3"/>
  
  <!-- Outfit details - left side -->
  <path d="M 55 110 Q 50 100 52 85 L 55 105 Q 58 118 65 130" fill="#2a2a3e" stroke="#1a1a2e" stroke-width="1"/>
  
  <!-- Outfit collar -->
  <path d="M 75 95 L 70 110 L 100 105 L 85 95" fill="#3a3a4e"/>
  <path d="M 125 95 L 130 110 L 100 105 L 115 95" fill="#3a3a4e"/>
  
  <!-- Visible tattoo/marking on outfit (left side) -->
  <text x="62" y="125" font-size="14" fill="#1a1a2e" font-weight="bold" text-anchor="middle" font-family="Arial">刃</text>
</svg>